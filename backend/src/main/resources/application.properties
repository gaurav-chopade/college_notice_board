# ======================================================================
#  College Online Notice Board - local development configuration
# ======================================================================
spring.application.name=college-notice-board
server.port=8080

# ---------------- MySQL ----------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/college_notice_board?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:gaurav}
spring.datasource.password=${DB_PASSWORD:gaurav}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# update = tables are created automatically on startup and altered when entities change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# data.sql / schema.sql are NOT executed (master data is managed separately)
spring.sql.init.mode=never

# ---------------- File upload ----------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ---------------- Mail (Gmail SMTP, optional) ----------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:noreply@college.edu}

# ---------------- Application ----------------
app.timezone=Asia/Kolkata
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# JWT (must be at least 64 characters)
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-development-only-secret-key-at-least-64-characters-long!!}
app.jwt.expiration-ms=86400000

# Development only: skip approval for self-registered STUDENTS. Teachers and HODs always need approval.
app.auth.auto-activate-registrations=${AUTO_ACTIVATE_REGISTRATIONS:false}
# Sign-in and registration limits (in-memory, per server instance)
app.auth.max-login-failures=5
app.auth.max-login-failures-per-ip=20
app.auth.login-window-minutes=15
app.auth.max-registrations-per-hour=10

# ---------------- Public site (shown without sign-in) ----------------
app.college.name=${COLLEGE_NAME:ABC College}
app.college.tagline=Stay informed about admissions, academics, examinations, events and important college announcements.
app.college.about=${COLLEGE_ABOUT:ABC College offers degree engineering and diploma (polytechnic) programmes on one campus, with experienced faculty, modern laboratories and an active placement cell.}
app.college.address=${COLLEGE_ADDRESS:College Road, Pimpri, Pune, Maharashtra 411018}
app.college.phone=${COLLEGE_PHONE:+91 20 0000 0000}
app.college.email=${COLLEGE_EMAIL:info@college.edu}
app.college.admission-phone=${COLLEGE_ADMISSION_PHONE:+91 20 0000 0001}
app.college.office-hours=Monday to Saturday, 10:00 am to 5:00 pm
app.college.engineering-about=Four-year B.Tech degree programmes, affiliated to the state technological university.
app.college.polytechnic-about=Three-year diploma programmes approved by the state board of technical education.

# Cloudinary (attachments disabled until these are set)
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.root-folder=college-notice-board/notices
app.cloudinary.download-url-ttl-seconds=300
app.files.max-size-bytes=10485760

# AI notice assistant (falls back to offline drafter when key is empty)
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=https://api.anthropic.com/v1/messages
app.ai.model=claude-sonnet-5-5

# Scheduler: publish scheduled / expire notices every minute
app.scheduler.interval-ms=60000

# Insert sample users and notices on first start (only when users table is empty)
app.seed.enabled=${SEED_DATA:true}

# ---------------- Swagger ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.college.noticeboard=INFO
