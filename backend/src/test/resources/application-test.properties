# In-memory H2 for tests - no MySQL needed
spring.datasource.url=jdbc:h2:mem:noticeboard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha-512-signing-in-unit-tests-only-1234567890
app.seed.enabled=false
app.mail.enabled=false
app.scheduler.interval-ms=3600000
app.auth.auto-activate-registrations=true
# Generous limits so the suite's own logins and registrations never trip them;
# RegistrationApprovalIntegrationTest checks the per-account login limit explicitly.
app.auth.max-registrations-per-hour=1000
app.auth.max-login-failures-per-ip=1000
