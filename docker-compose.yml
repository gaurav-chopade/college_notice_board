# Optional local MySQL:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: college_notice_board
      MYSQL_USER: gaurav
      MYSQL_PASSWORD: gaurav
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
